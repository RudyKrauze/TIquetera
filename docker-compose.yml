services:
  app:
    build: .
    ports:
      - "3005:3005"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ticket_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-tiquetera_db}
    volumes:
      - .:/app
      - /app/node_modules
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-ticket_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tiquetera_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticket_app} -d ${DB_NAME:-tiquetera_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    image: prodrigestivill/postgres-backup-local
    restart: "no"
    depends_on:
      - db
    links:
      - db:db
    volumes:
      - ./backups:/backups
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME:-tiquetera_db}
      - POSTGRES_USER=${DB_USER:-ticket_app}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@every 6h00m
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080

volumes:
  postgres_data:
