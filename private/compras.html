<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Compras e Insumos - Imagen Diagnóstica</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/notifications.css">
    <link rel="stylesheet" href="/css/compras.css">
    <link rel="stylesheet" href="/css/design-system.css">
</head>

<body style="visibility: hidden; opacity: 0; transition: opacity 0.5s ease;">
    <div class="navbar">
        <div class="navbar-brand">
            <a href="/" style="display: flex; align-items: center; text-decoration: none;">
                <img src="/logo.png" alt="Imagen Diagnóstica" class="navbar-logo">
            </a>
            <h1>Panel de Compras e Insumos</h1>
        </div>
        <div class="user-info">
            <a href="/reportes" class="nav-btn-reports" title="Ver métricas y generar reportes compartibles">
                📊 Reportes
            </a>
            <span id="currentUserName">Cargando...</span>

            <!-- Sistema de Notificaciones -->
            <div class="notification-wrapper">
                <button id="notification-bell" class="notification-bell" aria-label="Notificaciones"
                    aria-expanded="false" aria-haspopup="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    <span id="notification-badge" class="notification-badge hidden">0</span>
                </button>

                <div id="notification-dropdown" class="notification-dropdown" role="menu" aria-label="Notificaciones">
                    <div class="notification-dropdown-header">
                        <h3>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                            </svg>
                            Notificaciones
                        </h3>
                        <button id="mark-all-read-btn" class="mark-all-read-btn">Marcar todas</button>
                    </div>
                    <div id="notification-list" class="notification-list" role="list">
                        <div class="notification-empty">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                            </svg>
                            <p>No tienes notificaciones nuevas</p>
                        </div>
                    </div>
                    <div class="notification-dropdown-footer">
                        <a href="/notificaciones" class="view-all-btn">
                            Ver todas las notificaciones
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <!-- Section Title -->
        <div style="margin-bottom: 1rem;">
            <h2 style="color: #2c3e50; font-size: 1.3em;">🛒 Mis Solicitudes de Compras</h2>
        </div>

        <!-- Tickets View -->
        <div id="ticketsView" class="tickets-section">
            <div class="section-header">
                <h2>Todos los Tickets</h2>
                <div class="header-actions">
                    <div class="filters">
                        <select id="priorityFilter" class="filter-select" onchange="applyFilters()">
                            <option value="">⚠️ Todas las prioridades</option>
                            <option value="high">🔴 Alta</option>
                            <option value="medium">🟡 Media</option>
                            <option value="low">🟢 Baja</option>
                        </select>
                        <!-- NUEVO: Filtros de rango de fecha -->
                        <div class="date-filter-group">
                            <input type="date" id="startDateFilter" class="date-input" 
                               onchange="updateDateMin(); applyFilters();" 
                               placeholder="Desde">
                            <span class="date-separator">→</span>
                            <input type="date" id="endDateFilter" class="date-input" 
                                   onchange="applyFilters()" 
                                   placeholder="Hasta">
                            <button id="clearDatesBtn" class="btn-clear-dates" onclick="clearDateFilters()" 
                                    title="Limpiar fechas">
                                🗑️
                            </button>
                        </div>
                        <select id="sortFilter" class="filter-select" onchange="applyFilters()">
                            <option value="date-desc">📅 Más recientes</option>
                            <option value="date-asc">📅 Más antiguos</option>
                            <option value="priority-desc">⚠️ Alta prioridad</option>
                            <option value="priority-asc">⚠️ Baja prioridad</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="search-container" style="padding: 1rem; background: #f8f9fa; border-bottom: 1px solid #e9ecef;">
                <input type="text" id="searchInput" class="search-input"
                    placeholder="🔍 Buscar por título, descripción, email...">
            </div>

            <div class="tickets-list" id="ticketsList">
                <!-- Tickets will be populated here -->
            </div>

            <!-- Paginación -->
            <div class="pagination-container" id="paginationContainer" style="display:none;">
                <div class="pagination-info">
                    Mostrando <span id="showingCount">0</span> de <span id="totalCount">0</span> tickets
                </div>
                <div class="pagination-controls">
                    <button class="btn-page" onclick="changePage('first')" id="btnFirst">⏮️ Primera</button>
                    <button class="btn-page" onclick="changePage('prev')" id="btnPrev">◀️ Anterior</button>
                    <span class="page-numbers" id="pageNumbers"></span>
                    <button class="btn-page" onclick="changePage('next')" id="btnNext">Siguiente ▶️</button>
                    <button class="btn-page" onclick="changePage('last')" id="btnLast">Última ⏭️</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal de detalles -->
    <div class="ticket-detail-modal" id="ticketModal">
        <div class="ticket-modal-content">
            <div class="modal-header">
                <h2>Detalles del Ticket</h2>
                <button class="close-modal" onclick="closeTicketModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Ticket details will be populated here -->
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="login-form" id="loginForm">
        <div class="login-modal">
            <h2>🔐 Iniciar Sesión - Compras</h2>
            <form id="loginFormElement">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña:</label>
                    <div class="password-container">
                        <input type="password" id="loginPassword" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                            👁️
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login">Iniciar Sesión</button>
                <div class="error" id="loginError"></div>
            </form>
        </div>
    </div>

    <script src="/js/core-panel.js?v=3.0"></script>
    <script src="/js/compras.js?v=3.0"></script>

    <!-- Sistema de Notificaciones -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/js/notifications.js"></script>

    <!-- Push Notifications -->
    <link rel="stylesheet" href="/css/push-notifications.css">
    <script src="/js/push-notifications.js"></script>
</body>

</html>
